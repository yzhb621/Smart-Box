<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Request</title>
</head>
<body>
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
    <p style="font-size: 1.5rem; margin-bottom: 1.5rem;" id="message">Processing your request...</p>
    <a href="./home" style="padding: 0.75rem 1.5rem; background-color: #3599dc; color: #fff; border: none; border-radius: 4px; font-size: 1rem; margin-bottom: 1rem; cursor: pointer;">
      Return to home
    </a>
  </div>

  <!-- Load EmailJS browser SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="/auth.js"></script>
  
  <script>
    (async function(e){
      try{
        var res = await fetch("/api/email-key", { method: 'POST' })
        if (!res.ok) {
          throw new Error(`Response status: ${res.status}`);
        }

        const result = await res.json();
        emailjs.init(result.key);

        sendEmail();

      }
      catch (error){
        console.log(error);
      }
    })();
  </script>

  <script>
    
    async function sendEmail(){
      // Parse URL parameters from the current page
      const params = new URLSearchParams(window.location.search);
      const email = params.get('e');
      const code = params.get('c');
      const areaID = params.get('a');
      const serID = params.get('s');

      if (!email || !code) {
        document.getElementById('message').textContent = "Missing email or code in the URL.";
        return;
      }

      // Prepare template parameters
      const templateParams = {
        email: atob(email),
        passcode: "https://smart-courier-box.vercel.app/qr?c=" + code
      };

      // Send email
      try {
        await emailjs.send('service_agd4kkq', 'template_z1lh75k', templateParams);
        document.getElementById('message').textContent = "Request sent successfully, you can close this page now.";
      } catch (error) {
        console.error('FAILED...', error);
        document.getElementById('message').textContent = "Failed to send email. Please try again.";
        return;
      }

      // --- Post parcel data to database ---
      try {
        // Ensure Firebase Auth state is ready before using SCBAuth.fetch
        try { if (window.SCBAuth && SCBAuth.ready) await SCBAuth.ready(); } catch(_) {}
        // Get recipient UID by email
  const profileRes = await SCBAuth.fetch(`/api/profile/${encodeURIComponent(atob(email))}`);
        const profile = await profileRes.json();
        const recipientId = profile.uid || null;

        // Prepare parcel data
        const parcelData = {
          courierId: null,
          createdAt: 'FIREBASE_TIMESTAMP',
          deliveredAt: 'FIREBASE_TIMESTAMP',
          deliveryAddress: null,
          qrKeyId: code,
          recipientId: recipientId,
          retrievedAt: null,
          status: null,
          areaId: atob(areaID),
          serialNumber: atob(serID)
        };

  // Post to /api/parcels
  const res = await SCBAuth.fetch('/api/parcels', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(parcelData)
        });
        if (!res.ok) {
          throw new Error('Failed to save parcel data');
        }
        console.log('Parcel data saved');
      } catch (err) {
        console.error('Error posting parcel data:', err);
      }
    }
    
  </script>
</body>
</html>
