name: Project checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: python -m py_compile py/app.py py/cloud.py py/recover.py
      - run: python -m unittest discover -s py -p 'test_*.py'
