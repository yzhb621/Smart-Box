<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SCB Delivery Simulator</title>
  <style>
    :root {
      --primary: #2c3e50;
      --secondary: #3498db;
      --success: #2ecc71;
      --warning: #f39c12;
      --danger: #e74c3c;

      --bezel: #1b1f24;
      --bezel-edge: #0f1216;
      --screen-bg: #0b1724;
      --screen-grad-1: rgba(30, 60, 90, 0.35);
      --screen-grad-2: rgba(0, 0, 0, 0.35);
    }

    body {
      font-family: 'Arial', sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      background-color: #ecf0f1;
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 30px;
    }

    .simulator-container {
      background: white;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      padding: 25px;
      display: flex;
      flex-direction: row;
      gap: 32px;
      align-items: stretch;
    }

    .left-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .left-panel img {
      width: 100%;
      max-width: 320px;
      border-radius: 10px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      background: #fff;
    }

    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .monitor {
      background: linear-gradient(180deg, var(--bezel), var(--bezel-edge));
      border-radius: 18px;
      padding: 14px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 10px 24px rgba(0,0,0,0.25);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .monitor-screen {
      flex: 1;
      background: radial-gradient(120% 110% at 50% 50%, var(--screen-grad-1), var(--screen-grad-2)), var(--screen-bg);
      border-radius: 12px;
      overflow: hidden;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      color: #ecf0f1;
    }

    .scan-window {
      width: 100%;
      max-width: 480px;
      height: 280px;
      border: 2px dashed rgba(255,255,255,0.25);
      border-radius: 10px;
      background: rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      text-align: center;
    }

    .scanner-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #scannerView video {
      transform: scaleX(-1) !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      border-radius: 6px;
    }

    .scanner-message {
      font-size: 1.1em;
      text-align: center;
      margin: 10px 0;
    }

    .status-indicator {
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      margin-bottom: 14px;
      max-width: 90%;
    }
    .status-waiting { background-color: #f1c40f; color: #34495e; }
    .status-scanning { background-color: #3498db; color: white; }
    .status-success { background-color: #2ecc71; color: white; }

    .qr-generator {
      text-align: center;
      margin: 12px 0;
      display: none;
    }
    .qr-code-container {
      margin: 12px auto;
      padding: 12px;
      background: white;
      border-radius: 8px;
      display: inline-block;
    }

    .control-panel {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 10px 20px;
      background-color: var(--secondary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      min-width: 120px;
    }
    .action-btn:hover { background-color: #2980b9; }
    .action-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
    .action-btn.secondary { background-color: var(--warning); }

    @media (max-width: 900px) {
      .simulator-container { flex-direction: column; }
      .left-panel { text-align: center; }
    }
  </style>
</head>
<body>
  <h1>Smart Courier Box Simulator</h1>

  <div class="simulator-container">
    <div class="left-panel">
      <img id="boxImage" src="images/unlocked.png" alt="Box Status" />
    </div>

    <div class="right-panel">
      <div class="monitor">
        <div class="monitor-screen">
          <div class="scan-window">
            <div class="scanner-container" id="scannerView">
              <p style="font-size:1.1em;">Click “Start Delivery” to begin.</p>
            </div>
          </div>

          <p class="scanner-message" id="scannerMessage">Ready to scan recipient email QR</p>

          <div class="status-indicator status-waiting" id="statusIndicator">
            System Ready
          </div>

          <div class="qr-generator" id="qrGenerator">
            <h3>Generated Pickup QR Code</h3>
            <div class="qr-code-container">
              <canvas id="qrCanvas"></canvas>
            </div>
            <p>Please scan this QR code to open the box</p>
          </div>

          <div class="control-panel">
            <button class="action-btn" id="startBtn">Start Delivery</button>
            <button class="action-btn secondary" id="scanPickupBtn" disabled>Scan Pickup Code</button>
            <button class="action-btn" id="resetBtn" disabled>Reset System</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="unlockSound" src="sounds/unlock.mp3" preload="auto"></audio>
  <audio id="lockSound" src="sounds/lock.mp3" preload="auto"></audio>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="sim.js"></script>
</body>
</html>
